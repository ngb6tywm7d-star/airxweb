<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirX</title>
    <style>
        body { background-color: #0d0f1a; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        h1 { color: #4facfe; text-shadow: 0 0 15px #4facfe; }
        .card { background-color: #1a1d2e; border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn { background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); border: none; padding: 10px 20px; border-radius: 20px; color: white; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-premium { background: linear-gradient(90deg, #a18cd1 0%, #fbc2eb 100%); }
    </style>
</head>
<body>
    <h1>AirX</h1>
    <p>Твой персональный ИИ</p>
    
    <div class="card">
        <h2>Привет! 👋</h2>
        <p>Чем могу помочь сегодня?</p>
        <button class="btn">Начать общение</button>
    </div>

    <div class="card">
        <h3>AirX Vision</h3>
        <p>Фото на устройстве</p>
    </div>

    <div class="card">
        <h3>AirX Studio</h3>
        <p>Создай композицию</p>
    </div>

    <div class="card">
        <h3>Настройки</h3>
        <p>Персонализация</p>
    </div>

    <div class="card" style="background-color: #2a1b3d;">
        <h3>AirX Voice — Premium</h3>
        <p>Голосовой режим</p>
        <button class="btn btn-premium">199 ₽ / 7 дней</button>
    </div>
</body>
</html>
